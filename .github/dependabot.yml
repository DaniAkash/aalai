# Weekly dependency PRs across the bun workspace, the Cargo workspace, and the
# GitHub Actions workflows. Major bumps are opt-in only; the routine queue is
# minor + patch grouped so it stays reviewable. A security update that needs a
# major bump is still opened, because `ignore` rules do not apply to security
# updates.
#
# Directory coverage:
#   bun            -> / (workspace root; dependabot walks the workspace tree
#                        and proposes bumps for app/* and packages/*)
#   cargo          -> /app/native/src-tauri (where Cargo.toml lives)
#   github-actions -> / (all workflows under .github/workflows/)
#
# The cooldown mirrors the release-age gate in bunfig.toml: a version has to
# survive a few days in the wild before it is proposed here.

version: 2

updates:
  # Bun workspace root, covering app/native and packages/core.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      # Tauri ships its JavaScript packages and its Rust crates as one release
      # train, and the two halves are bumped by separate ecosystems here. Keep
      # the JavaScript side in a single pull request so it can be merged
      # alongside the matching cargo one rather than drifting a version apart.
      tauri:
        patterns:
          - "@tauri-apps/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"

  # Cargo workspace for the Tauri shell. Tauri, its plugins and tauri-build
  # move together, so the grouped minor + patch pull request is what keeps
  # them consistent.
  - package-ecosystem: "cargo"
    directory: "/app/native/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"

  # Workflow action bumps. Lower cap because the surface is one workflow.
  #
  # The rust toolchain in ci.yml is pinned on purpose: rust-cache keys on the
  # toolchain, so a floating version turns a warm cache into a coin flip.
  # Dependabot does not manage that pin, so it stays a deliberate bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
