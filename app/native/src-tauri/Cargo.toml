[package]
name = "aalai"
version = "0.1.0"
description = "A software factory that sits in your menu bar"
authors = ["Dani Akash"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aalai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Declarative rather than a -D warnings flag on the check command. Plain
# `cargo clippy` exits 0 with warnings present, so the flag form is the
# difference between a gate and a formality. This also applies in
# rust-analyzer, so the error shows up while the code is being written.
# priority = -1 lets an individual lint be relaxed above the group.
[lints.clippy]
all = { level = "deny", priority = -1 }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
